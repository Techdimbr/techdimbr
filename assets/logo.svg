<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="cyberGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="50%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="cyberGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Glowing background aura -->
  <circle cx="256" cy="256" r="210" fill="#00E5FF" opacity="0.08" filter="url(#glow)"/>
  
  <!-- Outer Tech Hexagon Shield -->
  <polygon points="256,40 440,145 440,367 256,472 72,367 72,145" 
           stroke="url(#cyberGrad1)" stroke-width="8" stroke-linejoin="round" fill="#0A1120" fill-opacity="0.9" />

  <!-- Inner Circuit Lines -->
  <path d="M72,145 L256,256 L440,145" stroke="url(#cyberGrad2)" stroke-width="4" stroke-opacity="0.4" />
  <path d="M256,256 L256,472" stroke="url(#cyberGrad2)" stroke-width="4" stroke-opacity="0.4" />
  
  <!-- Cyber Node Dots -->
  <circle cx="256" cy="40" r="7" fill="#00E5FF" />
  <circle cx="440" cy="145" r="7" fill="#00E5FF" />
  <circle cx="440" cy="367" r="7" fill="#2563EB" />
  <circle cx="256" cy="472" r="7" fill="#7C3AED" />
  <circle cx="72" cy="367" r="7" fill="#2563EB" />
  <circle cx="72" cy="145" r="7" fill="#00E5FF" />

  <!-- Dynamic Dimension "T" Monogram & Core Shield -->
  <path d="M160 170 H352 V212 H280 V360 H232 V212 H160 V170 Z" fill="url(#cyberGrad1)" filter="url(#glow)"/>
  
  <!-- Precision Cyber Core -->
  <polygon points="256,120 310,152 310,216 256,248 202,216 202,152" 
           stroke="#00E5FF" stroke-width="2.5" fill="none" opacity="0.6"/>
  <circle cx="256" cy="184" r="5" fill="#00E5FF"/>
</svg>
